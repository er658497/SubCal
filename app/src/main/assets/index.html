<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SubCal</title>
<style>
:root{color-scheme:dark;--bg:#0b1018;--surface:#121923;--line:#334255;--muted:#91a0b3}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:#e8eef7;font-family:system-ui,sans-serif;overflow-x:hidden}button,input{font:inherit}button{color:inherit;background:none;border:0;cursor:pointer}
.app{min-height:100vh;padding:calc(env(safe-area-inset-top) + 8px) 0 calc(env(safe-area-inset-bottom) + 10px)}
.top{display:flex;justify-content:space-between;align-items:flex-start;padding:0 12px 8px}.title{font-size:22px;font-weight:750}.menu-tools{display:flex;flex-direction:column;align-items:flex-end;gap:6px}.job-filter{position:relative;display:grid;grid-template-columns:1fr 1fr;width:146px;height:29px;padding:3px;border:1px solid #3b4a5f;border-radius:18px;background:#101722;isolation:isolate}.job-filter .filter-thumb{position:absolute;z-index:-1;top:3px;left:3px;bottom:3px;width:calc(50% - 3px);border-radius:14px;background:#245d96;transition:transform .18s ease}.job-filter.all .filter-thumb{transform:translateX(100%)}.job-filter button{min-width:0;padding:2px 4px;border-radius:14px;font-size:10px;font-weight:650;color:#aeb9c8;white-space:nowrap}.job-filter button.active{color:#fff}.sync{font-size:11px;color:var(--muted)}
.brand{min-width:0}.welcome{font-size:12px;color:#b8c6d8;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:68vw}.menu{position:relative}.hamburger{font-size:27px;line-height:1;padding:5px 8px;border:1px solid var(--line);border-radius:9px;background:#182331}.panel{display:none;position:absolute;right:0;top:44px;z-index:30;min-width:220px;background:#1b2634;border:1px solid var(--line);border-radius:10px;padding:5px;box-shadow:0 8px 25px #0008}.menu.open .panel{display:block}.panel button{display:block;width:100%;text-align:left;padding:10px;border-radius:7px}.panel button:hover{background:#263548}.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 10px;border-bottom:1px solid #2b3747;font-size:13px}.panel .switch{display:flex;align-items:center;gap:7px;width:auto;padding:5px 7px;border:1px solid #506075;border-radius:20px;font-size:12px}.switch-dot{width:9px;height:9px;border-radius:50%;background:#718096}.switch.on .switch-dot{background:#54d88a}.trade-row{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid #263244}.trade-row:last-child{border:0}.trash{display:flex;align-items:center;justify-content:center;flex:0 0 28px;width:28px;height:28px;color:#ff4545;padding:3px;border-radius:4px;background:transparent}.trash svg{display:block;width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.sub-name{flex:1;min-width:0;width:0;margin:0!important;padding:7px!important;font-weight:700;border-radius:7px!important}.color-picker{position:relative;flex:0 0 22px;width:22px;height:22px;border:1px solid #65748a;border-radius:5px;background:conic-gradient(red, #ff0, lime, cyan, blue, magenta, red);overflow:hidden}.color-picker input{position:absolute;inset:0;width:100%!important;height:100%;margin:0!important;padding:0!important;opacity:0;cursor:pointer}
.nav{display:flex;align-items:center;padding:4px 8px}.nav .label{flex:1;min-width:0;text-align:center;font-size:16px;font-weight:650}.nav button{padding:7px}.views{display:flex;gap:4px;padding:0 8px 7px}.views button{padding:6px 9px;border-radius:7px;background:#182331;color:#9eabbb;font-size:12px}.views button.active{background:#245d96;color:#fff}
.grid{padding:0 3px}.week-head,.week-row{display:grid;grid-template-columns:minmax(72px,1.08fr) repeat(5,minmax(0,1fr));width:100%}.week-head>div,.week-row>div{border:.5px solid var(--line)}.week-head{height:48px}.dayhead{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}.dayhead span{display:block;color:#8997aa;margin-left:3px}.add{font-size:25px;text-align:left;padding-left:8px}.project{min-width:0;padding:7px 4px;display:flex;align-items:center;cursor:pointer}.project b{display:block;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}.cell{min-width:0;min-height:44px;padding:3px;cursor:pointer;vertical-align:top;touch-action:manipulation;text-align:center}.cell .trade{text-align:center}.cell:active{background:#1a2b40}.trade{display:block;width:100%;margin:2px 0;padding:4px 3px;border:1px solid currentColor;border-radius:5px;background:color-mix(in srgb,currentColor 14%,transparent);font-size:9px;font-weight:700;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:clip}
.calendar{padding:0 3px}.cal-head,.cal-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}.cal-head>div,.cal-row>div{border:.5px solid var(--line)}.cal-head{height:35px}.cal-head div{text-align:center;padding-top:9px;font-size:10px;font-weight:700}.cal-row{min-height:95px}.cal-day{min-width:0;padding:3px}.adj{background:#080d14}.date{text-align:center;font-size:12px;font-weight:700;color:#e8eef7}.adj .date{color:#566274}.tradecal{display:block;margin-top:3px;padding:4px 2px;border:1px solid currentColor;border-radius:5px;background:color-mix(in srgb,currentColor 14%,transparent);font-size:9px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:clip;text-align:center}.tradecal .cal-initials{font-size:8px;font-weight:400;color:#c1ccda}
.modal-bg{display:none;position:fixed;inset:0;background:#000a;z-index:50;align-items:center;justify-content:center;padding:18px}.modal-bg.show{display:flex}.modal{width:min(440px,100%);max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:17px}.modal h2{margin:0 0 13px;font-size:19px}.modal input{width:100%;padding:10px;border:1px solid #3b4a5f;background:#0b1018;color:#fff;border-radius:8px;margin-bottom:10px}.checks{max-height:48vh;overflow:auto;border:1px solid #293749;border-radius:8px}.check{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid #263244}.check:last-child{border:0}.check input{flex:0 0 18px;width:18px;height:18px;margin:0}.check .trade{display:inline-block;width:auto;max-width:calc(100% - 65px);margin:0;padding:5px 7px;font-size:11px;line-height:1.1;border-radius:5px}.check .muted{white-space:nowrap}.actions{display:flex;justify-content:flex-end;gap:7px;margin-top:13px}.actions button{padding:9px 13px;border-radius:8px}.primary{background:#245d96}.danger{color:#ff7777}.notice{padding:10px;border-radius:8px;background:#172333;color:#aeb9c8;font-size:12px}
.login{position:fixed;inset:0;background:#0b1018;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}.loginbox{width:min(390px,100%);background:#121923;border:1px solid var(--line);border-radius:15px;padding:22px}.loginbox h1{margin-top:0}.loginbox input{width:100%;padding:11px;margin:5px 0 10px;border:1px solid #3b4a5f;background:#0b1018;color:#fff;border-radius:8px}.loginbox button{width:100%;padding:11px;background:#245d96;border-radius:8px;font-weight:700}
.notif{max-height:55vh;overflow:auto}.n{padding:10px;border-bottom:1px solid #2b3747;font-size:12px}.n.unread{background:#19283a}.muted{color:var(--muted);font-size:11px}
@media(max-width:600px){.week-head,.week-row{grid-template-columns:minmax(62px,1.08fr) repeat(5,minmax(0,1fr))}.project{padding:5px 2px}.project b{font-size:10px}.trade{font-size:8px;padding:3px 2px}.calendar{padding:0 1px}}
</style></head>
<body><div id="login" class="login"><div class="loginbox"><h1>Welcome to SubCal</h1><p>Enter your first and last name. This device will remember you.</p><input id="first" placeholder="First name"><input id="last" placeholder="Last name"><button id="start">Continue</button></div></div>
<main class="app"><header class="top"><div class="brand"><div class="title">SubCal</div><div id="welcome" class="welcome">Welcome</div><button id="editUsersBtn" type="button" style="font-size:9px;color:#91a0b3;padding:1px 0;text-decoration:underline">Edit users</button><div id="sync" class="sync">● Local</div></div><div class="menu-tools"><div id="menu" class="menu"><button id="menuBtn" class="hamburger" aria-label="Open menu">☰</button><div class="panel"><button data-action="subs">Edit Subs</button><div class="toggle-row"><span>Notifications</span><button id="notifToggle" class="switch" aria-pressed="true"><span class="switch-dot"></span><span id="notifState">On</span></button></div><button data-action="logout">Log Out</button></div></div><div id="jobFilter" class="job-filter all" role="group" aria-label="Schedule filter"><span class="filter-thumb"></span><button id="myJobsBtn" type="button">Mine</button><button id="allJobsBtn" class="active" type="button">All</button></div></div></header>
<div class="views"><button id="weekBtn" class="active">Week View</button><button id="calBtn">Calendar View</button></div><div class="nav"><button id="prev">‹</button><div id="navLabel" class="label"></div><button id="next">›</button><button id="today">Today</button></div><section id="content"></section></main>
<div class="modal-bg" id="modal"><div class="modal"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="actions"><button id="cancel">Cancel</button><button id="save" class="primary">Done</button></div></div></div>
<script>
const decodeB64=s=>s?atob(s):"";
const SUPABASE_URL=decodeB64("__SUPABASE_URL_B64__"),KEY=decodeB64("__SUPABASE_KEY_B64__"),ID=decodeB64("__SCHEDULE_ID_B64__"),USERKEY="subcal-user";
const storage={getItem(k){try{return window.localStorage.getItem(k)}catch(e){return null}},setItem(k,v){try{window.localStorage.setItem(k,v)}catch(e){}},removeItem(k){try{window.localStorage.removeItem(k)}catch(e){}}};
window.onerror=(message,source,line,col)=>{try{alert("SubCal error: "+message+" (line "+line+")")}catch(e){};return false};
const colors=["#4da6ff","#ffd84d","#aeb7c4","#ffffff","#b77cff","#ff8c42","#54d88a","#ff6b9d"];
let state=JSON.parse(storage.getItem("subcal-state")||'{"users":[],"trades":[],"projects":[],"assignments":{},"notifications":[]}'),me=JSON.parse(storage.getItem(USERKEY)||"null"),mode="week",filter="all",monday=getMonday(new Date()),month=new Date(new Date().getFullYear(),new Date().getMonth(),1),editing=null;
const $=x=>document.getElementById(x), uid=()=>{try{if(window.crypto&&typeof window.crypto.randomUUID==="function")return window.crypto.randomUUID()}catch(e){}return "id-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,12)}, dateKey=d=>new Date(d).toISOString().slice(0,10);
function getMonday(d){d=new Date(d);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function initials(n){return n.trim().split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase()}
function ensureDefaults(){if(!state.trades.length)state.trades=[{id:"plumbing",name:"Plumbing",color:"#4da6ff"},{id:"electrical",name:"Electrical",color:"#ffd84d"},{id:"hvac",name:"HVAC / Mechanical",color:"#aeb7c4"},{id:"tile",name:"Tile",color:"#ffffff"}]}
function save(){storage.setItem("subcal-state",JSON.stringify(state))}
function syncText(t){$("sync").textContent=t}
async function api(method,body){let u=SUPABASE_URL.replace(/\/$/,"")+"/rest/v1/crew_schedule";if(method==="GET")u+="?id=eq."+encodeURIComponent(ID)+"&select=payload";else u+="?on_conflict=id";let r=await fetch(u,{method,headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"},body:method==="GET"?undefined:JSON.stringify(body)});if(!r.ok)throw Error("HTTP "+r.status);return method==="GET"?r.json():null}
async function refreshLatest(){if(!KEY)return false;try{const a=await api("GET");if(a[0]?.payload){state=a[0].payload;ensureDefaults();save();return true}syncText("● Sync error");return false}catch(e){syncText("● Sync error");return false}}async function pull(){if(!KEY){syncText("● Local only");return}try{if($("modal").classList.contains("show")){syncText("● Synced · edits protected");return}await refreshLatest();syncText("● Synced · "+new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}));render()}catch(e){syncText("● Sync error")}}
async function push(){save();if(!KEY)return true;try{syncText("↻ Syncing…");await api("POST",{id:ID,payload:state,updated_at:new Date().toISOString()});const rows=await api("GET");if(!rows[0]?.payload)throw Error("Shared schedule could not be verified");state=rows[0].payload;ensureDefaults();save();syncText("● Synced · "+new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}));return true}catch(e){syncText("● Sync error");alert("SubCal could not confirm that the shared changes were saved. Check your connection before continuing.");return false}}
async function openCell(p,d){const refreshed=await refreshLatest();if(KEY&&!refreshed){alert("Could not load the latest shared schedule. Please try again.");return}p=state.projects.find(x=>x.id===p.id)||p;const date=dateKey(d),snapshot={};state.trades.forEach(t=>{const a=state.assignments[p.id+"|"+date+"|"+t.id];if(a)snapshot[t.id]={...a}});editing={type:"cell",project:p,date,assignments:snapshot,selected:new Set(Object.keys(snapshot))};$("modalTitle").textContent=p.name+" · "+d.toLocaleDateString([], {weekday:"long",month:"short",day:"numeric"});$("modalBody").innerHTML='<div class="notice">Select every trade scheduled for this job that day.</div><div class="checks">'+state.trades.map(t=>{let a=state.assignments[p.id+"|"+dateKey(d)+"|"+t.id];return '<label class="check"><input type="checkbox" data-trade="'+esc(t.id)+'" '+(a?"checked":"")+'><span class="trade" style="color:'+t.color+'" title="'+esc(t.name)+'">'+esc(t.name)+'</span>'+(a?' <span class="muted">— '+esc(initials(a.userName||""))+'</span>':'')+'</label>'}).join("")+'</div>';$("modalBody").querySelectorAll("[data-trade]").forEach(cb=>{cb.onchange=()=>{let key=editing.project.id+"|"+editing.date+"|"+cb.dataset.trade,old=state.assignments[key];if(cb.checked&&!old){const otherJob=state.projects.find(p=>p.id!==editing.project.id&&state.assignments[p.id+"|"+editing.date+"|"+cb.dataset.trade]);if(otherJob){if(!confirm("This sub is already scheduled for this day. Would you like to continue?")){cb.checked=false;return}else cb.dataset.conflictConfirmed="true"}}if(!cb.checked&&old&&old.userId!==me.id){if(!confirm("Are you sure you want to unschedule this sub?")){cb.checked=true;delete cb.dataset.confirmedRemoval}else cb.dataset.confirmedRemoval="true"}}});$("modal").classList.add("show")}
function openProject(p){editing={type:"project",project:p};$("modalTitle").textContent=p?"Edit Project":"Add Project";$("modalBody").innerHTML='<input id="projectName" placeholder="Project name" value="'+esc(p?.name||"")+'"><div class="actions"><button id="projectDelete" class="danger" '+(p?"":'style="display:none"')+'>Delete</button></div>';$("modal").classList.add("show");$("projectName").focus()}
async function openSubs(){const continuing=editing?.type==="subs";if(!continuing){const refreshed=await refreshLatest();if(KEY&&!refreshed){alert("Could not load the latest shared sub list. Please try again.");return}}const originalTradeIds=continuing?editing.originalTradeIds:state.trades.map(t=>t.id);editing={type:"subs",originalTradeIds};$("modalTitle").textContent="Edit Subs";$("modalBody").innerHTML='<div id="tradeList">'+state.trades.map(t=>'<div class="trade-row"><button class="trash" data-deltrade="'+esc(t.id)+'" aria-label="Delete '+esc(t.name)+'"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h11M6 2.5h4M4 4.5l.7 9h6.6l.7-9M6.5 6.5v4.5M9.5 6.5v4.5"/></svg></button><input class="sub-name" data-tname="'+esc(t.id)+'" placeholder="New sub" value="'+esc(t.name)+'" style="color:'+t.color+';background:color-mix(in srgb,'+t.color+' 14%,#0b1018);border:1px solid '+t.color+'"><label class="color-picker" title="Choose color"><input type="color" data-tcolor="'+esc(t.id)+'" value="'+t.color+'" aria-label="Choose color for '+esc(t.name)+'"></label></div>').join("")+'</div><button id="addTrade" style="margin-top:10px">＋ Add sub</button>';$("modal").classList.add("show");document.querySelectorAll("[data-tcolor]").forEach(input=>input.oninput=()=>{let name=document.querySelector('[data-tname="'+input.dataset.tcolor+'"]');if(name){name.style.color=input.value;name.style.borderColor=input.value;name.style.background="color-mix(in srgb,"+input.value+" 14%,#0b1018)"}})}
function renderUsersList(){const ids=editing.deletedUserIds;$("modalBody").innerHTML=state.users.length?state.users.map(u=>'<div class="trade-row"><span style="flex:1">' +esc(u.name||"Unnamed user")+'</span><button type="button" class="trash" data-deluser="' +esc(u.id)+'">✕</button></div>').join(""):'<div class="notice">No saved users.</div>';document.querySelectorAll("[data-deluser]").forEach(button=>button.onclick=()=>{const u=state.users.find(x=>x.id===button.dataset.deluser);if(!u||!confirm("Delete "+u.name+"? Their scheduled subs will remain on the calendar."))return;editing.deletedUserIds.push(u.id);state.users=state.users.filter(x=>x.id!==u.id);renderUsersList()})}async function openUsers(){const ok=await refreshLatest();if(KEY&&!ok){alert("Could not load the shared user list.");return}editing={type:"users",deletedUserIds:[]};$("modalTitle").textContent="Edit Users";renderUsersList();$("modal").classList.add("show")}function openNotifs(){$("modalTitle").textContent="Notifications";$("modalBody").innerHTML='<div class="notif">'+state.notifications.filter(n=>n.recipientId===me.id).sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).map(n=>'<div class="n '+(!n.read?"unread":"")+'">'+esc(n.message)+'<div class="muted">'+new Date(n.createdAt).toLocaleString()+'</div></div>').join("")+'</div>';state.notifications.forEach(n=>{if(n.recipientId===me.id)n.read=true});save();$("modal").classList.add("show");updateBadge()}
async function applyCell(){const project=editing.project,date=editing.date,snapshot={...editing.assignments};const refreshed=await refreshLatest();if(KEY&&!refreshed){alert("Could not load the latest shared schedule. Your changes were not saved.");return}let changed=false;const notifications=[];$("modalBody").querySelectorAll("[data-trade]").forEach(cb=>{const tid=cb.dataset.trade,key=project.id+"|"+date+"|"+tid,wasAssigned=!!snapshot[tid],current=state.assignments[key];if(cb.checked&&!wasAssigned&&!current){const conflict=state.projects.some(p=>p.id!==project.id&&state.assignments[p.id+"|"+date+"|"+tid]);if(conflict&&!cb.dataset.conflictConfirmed&&!confirm("This sub is already scheduled for this day. Would you like to continue?"))return;state.assignments[key]={userId:me.id,userName:me.name,assignedAt:new Date().toISOString()};changed=true}else if(!cb.checked&&current&&(wasAssigned||cb.dataset.confirmedRemoval==="true")){const old=current;if(old.userId!==me.id&&!cb.dataset.confirmedRemoval){if(!confirm("Are you sure you want to unschedule this sub?")){cb.checked=true;return}}if(old.userId!==me.id){const recipient=state.users.find(u=>u.id===old.userId);if(recipient?.notificationsEnabled!==false){notifications.push({id:uid(),recipientId:old.userId,message:(state.trades.find(x=>x.id===tid)?.name||"Sub")+" was removed from "+project.name+" on "+new Date(date+"T12:00:00").toLocaleDateString(undefined,{weekday:"long"})+" by "+me.name+".",read:false,createdAt:new Date().toISOString()})}}delete state.assignments[key];changed=true}});if(notifications.length)state.notifications.push(...notifications);save();if(changed)await push();render()}
function renderWeek(){let ds=[0,1,2,3,4].map(i=>{let d=new Date(monday);d.setDate(d.getDate()+i);return d}),ps=state.projects,h='<div class="grid"><div class="week-head"><div><button class="add" id="addProject">+</button></div>'+ds.map(d=>'<div class="dayhead">'+d.toLocaleDateString([], {weekday:"short"}).toUpperCase()+' <span>'+d.getDate()+'</span></div>').join("")+'</div>';let rows=ps.map(p=>'<div class="week-row"><div class="project" data-project="'+p.id+'"><b>'+esc(p.name)+'</b></div>'+ds.map(d=>{let as=state.trades.filter(t=>{const a=state.assignments[p.id+"|"+dateKey(d)+"|"+t.id];return a&&(filter==="all"||a.userId===me.id)});return '<div class="cell" data-cell="'+p.id+'|'+dateKey(d)+'">'+as.map(t=>{let a=state.assignments[p.id+"|"+dateKey(d)+"|"+t.id];return '<span class="trade" style="color:'+t.color+'" title="'+esc(t.name)+'">'+esc(t.name)+'</span>'}).join("")+'</div>'}).join("")+'</div>').join("");return h+rows+"</div>"}
function renderCal(){let visibleProjects=state.projects;let fm=getMonday(new Date(month.getFullYear(),month.getMonth(),1)),lm=getMonday(new Date(month.getFullYear(),month.getMonth()+1,0)),h='<div class="calendar"><div class="cal-head">'+["MON","TUE","WED","THU","FRI"].map(x=>"<div>"+x+"</div>").join("")+"</div>";for(let w=new Date(fm);w<=lm;w.setDate(w.getDate()+7)){h+='<div class="cal-row">';for(let i=0;i<5;i++){let d=new Date(w);d.setDate(d.getDate()+i);let trades=state.trades.map(t=>{let assigned=visibleProjects.map(p=>state.assignments[p.id+"|"+dateKey(d)+"|"+t.id]).filter(a=>a&&(filter==="all"||a.userId===me.id));if(!assigned.length)return null;let who=[...new Set(assigned.map(a=>initials(a.userName||"")).filter(Boolean))].join(", ");return {trade:t,who}}).filter(Boolean);h+='<div class="cal-day '+(d.getMonth()!==month.getMonth()?"adj":"")+'"><div class="date">'+d.getDate()+"</div>"+trades.map(x=>'<span class="tradecal" style="color:'+x.trade.color+'">'+esc(x.trade.name)+(x.who?' <span class="cal-initials"> - '+esc(x.who)+'</span>':"")+'</span>').join("")+"</div>"}h+="</div>"}return h+"</div>"}
function render(){ensureDefaults();$("weekBtn").classList.toggle("active",mode==="week");$("calBtn").classList.toggle("active",mode==="calendar");$("jobFilter").classList.toggle("all",filter==="all");$("myJobsBtn").classList.toggle("active",filter==="mine");$("allJobsBtn").classList.toggle("active",filter==="all");$("navLabel").textContent=mode==="week"?monday.toLocaleDateString([], {month:"short",day:"numeric"})+" – "+new Date(monday.getTime()+4*86400000).toLocaleDateString([], {month:"short",day:"numeric",year:"numeric"}):month.toLocaleDateString([], {month:"long",year:"numeric"});$("content").innerHTML=mode==="week"?renderWeek():renderCal();document.querySelectorAll("[data-cell]").forEach(e=>{e.setAttribute("role","button");e.setAttribute("tabindex","0")});document.querySelectorAll("[data-project]").forEach(e=>e.onclick=()=>openProject(state.projects.find(p=>p.id===e.dataset.project)));const addProject=$("addProject");if(addProject)addProject.onclick=()=>openProject(null);updateBadge();updateWelcome()}
function updateBadge(){const badge=$("badge");if(!badge)return;let n=state.notifications.filter(x=>x.recipientId===me?.id&&!x.read).length;badge.textContent=n?" ("+n+")":""}function updateWelcome(){if(me){$("welcome").textContent="Welcome, "+me.name;let enabled=me.notificationsEnabled!==false;$("notifToggle").classList.toggle("on",enabled);$("notifToggle").setAttribute("aria-pressed",String(enabled));$("notifState").textContent=enabled?"On":"Off"}}
$("start").onclick=async()=>{let first=$("first").value.trim(),last=$("last").value.trim(),name=(first+" "+last).trim();if(!first||!last)return alert("Please enter your first and last name.");const normalized=name.toLocaleLowerCase().replace(/\s+/g," ");try{if(KEY){syncText("↻ Finding your account…");const remote=await api("GET");if(remote[0]?.payload)state=remote[0].payload;}}catch(e){}ensureDefaults();const existing=state.users.find(u=>String(u.name||"").trim().toLocaleLowerCase().replace(/\s+/g," ")===normalized);me=existing?{...existing,name}: {id:uid(),name,notificationsEnabled:true};state.users=state.users.filter(u=>u.id!==me.id&&! (String(u.name||"").trim().toLocaleLowerCase().replace(/\s+/g," ")===normalized));state.users.push(me);storage.setItem(USERKEY,JSON.stringify(me));save();$("login").style.display="none";render();push();if(KEY)setInterval(pull,15000)};$("menuBtn").onclick=()=>$("menu").classList.toggle("open");$("editUsersBtn").onclick=()=>openUsers();$("notifToggle").onclick=async()=>{await refreshLatest();let enabled=me.notificationsEnabled===false;me.notificationsEnabled=enabled;state.users=state.users.map(u=>u.id===me.id?{...u,notificationsEnabled:enabled}:u);storage.setItem(USERKEY,JSON.stringify(me));save();updateWelcome();await push()};
document.querySelectorAll("[data-action]").forEach(b=>b.onclick=async()=>{let a=b.dataset.action;$("menu").classList.remove("open");if(a==="subs")openSubs();else if(a==="notifications"){await refreshLatest();openNotifs()}else if(a==="logout"){me=null;storage.removeItem(USERKEY);$("modal").classList.remove("show");$("first").value="";$("last").value="";$("login").style.display="flex";$("first").focus()}});
$("myJobsBtn").onclick=()=>{filter="mine";render()};$("allJobsBtn").onclick=()=>{filter="all";render()};$("weekBtn").onclick=()=>{mode="week";render()};$("calBtn").onclick=()=>{mode="calendar";render()};$("prev").onclick=()=>{if(mode==="week")monday.setDate(monday.getDate()-7);else month.setMonth(month.getMonth()-1);render()};$("next").onclick=()=>{if(mode==="week")monday.setDate(monday.getDate()+7);else month.setMonth(month.getMonth()+1);render()};$("today").onclick=()=>{if(mode==="week")monday=getMonday(new Date());else month=new Date(new Date().getFullYear(),new Date().getMonth(),1);render()};
$("cancel").onclick=()=>{$("modal").classList.remove("show");editing=null};$("save").onclick=async()=>{if(!editing)return;if(editing.type==="cell"){await applyCell()}else if(editing.type==="project"){const projectEdit={...editing.project},name=$("projectName").value.trim();if(!name)return;const refreshed=await refreshLatest();if(KEY&&!refreshed){alert("Could not load the latest shared projects. Your changes were not saved.");return}if(projectEdit.id){state.projects=state.projects.map(p=>p.id===projectEdit.id?{...p,name}:p)}else state.projects.push({id:uid(),name,ownerId:me.id});state.projects.sort((a,b)=>a.name.localeCompare(b.name));await push()}else if(editing.type==="users"){await push()}else if(editing.type==="subs"){const originalIds=[...editing.originalTradeIds],draft=[...document.querySelectorAll("[data-tname]")].map(i=>({id:i.dataset.tname,name:i.value.trim(),color:document.querySelector('[data-tcolor="'+i.dataset.tname+'"]')?.value}));const refreshed=await refreshLatest();if(KEY&&!refreshed){alert("Could not load the latest shared sub list. Your changes were not saved.");return}const draftIds=new Set(draft.filter(t=>t.name).map(t=>t.id));for(const id of originalIds){if(!draftIds.has(id)){state.trades=state.trades.filter(t=>t.id!==id);Object.keys(state.assignments).filter(k=>k.endsWith("|"+id)).forEach(k=>delete state.assignments[k])}}for(const d of draft){if(!d.name)continue;const existing=state.trades.find(t=>t.id===d.id);if(existing){existing.name=d.name;if(d.color)existing.color=d.color}else state.trades.push({id:d.id,name:d.name,color:d.color||colors[state.trades.length%colors.length]})}await push()}$("modal").classList.remove("show");editing=null;render()};
$("modal").addEventListener("click",e=>{if(e.target.id==="addTrade"){state.trades.push({id:uid(),name:"",color:colors[state.trades.length%colors.length]});openSubs();const inputs=[...document.querySelectorAll("[data-tname]")];if(inputs.length)inputs[inputs.length-1].focus()}const deleteButton=e.target.closest("[data-deltrade]");if(deleteButton){let t=state.trades.find(x=>x.id===deleteButton.dataset.deltrade);if(confirm("Delete "+t.name+"?")){state.trades=state.trades.filter(x=>x.id!==t.id);Object.keys(state.assignments).filter(k=>k.endsWith("|"+t.id)).forEach(k=>delete state.assignments[k]);openSubs()}}if(e.target.id==="projectDelete"&&editing?.project&&confirm("Delete this project and its schedule?")){state.projects=state.projects.filter(p=>p.id!==editing.project.id);Object.keys(state.assignments).filter(k=>k.startsWith(editing.project.id+"|")).forEach(k=>delete state.assignments[k]);$("modal").classList.remove("show");editing=null;push();render()}});
$("content").addEventListener("click",e=>{const cell=e.target.closest("[data-cell]");if(!cell)return;try{const [pid,ds]=cell.dataset.cell.split("|");const p=state.projects.find(x=>x.id===pid);if(!p)throw Error("Project not found");openCell(p,new Date(ds+"T12:00:00")).catch(err=>alert("Could not open schedule: "+err.message))}catch(err){alert("Could not open schedule: "+err.message)}});$("content").addEventListener("keydown",e=>{const cell=e.target.closest("[data-cell]");if(cell&&(e.key==="Enter"||e.key===" ")){e.preventDefault();cell.click()}});document.addEventListener("click",e=>{if(!e.target.closest(".menu"))$("menu").classList.remove("open")});
if(!me){$("login").style.display="flex"}else{$("login").style.display="none";state.users=state.users.some(u=>u.id===me.id)?state.users:[...state.users,me];ensureDefaults();render();pull();setInterval(pull,15000)}
</script></body></html>
