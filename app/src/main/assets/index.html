<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SubCal</title>
<style>
:root{color-scheme:dark;--bg:#0b1018;--surface:#121923;--line:#334255;--muted:#91a0b3}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:#e8eef7;font-family:system-ui,sans-serif;overflow-x:hidden}button,input{font:inherit}button{color:inherit;background:none;border:0;cursor:pointer}
.app{min-height:100vh;padding:calc(env(safe-area-inset-top) + 8px) 0 calc(env(safe-area-inset-bottom) + 10px)}
.top{display:flex;justify-content:space-between;align-items:center;padding:0 12px 8px}.title{font-size:22px;font-weight:750}.sync{font-size:11px;color:var(--muted)}
.profile{position:relative}.profile>button{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#182331}.panel{display:none;position:absolute;right:0;top:44px;z-index:30;min-width:180px;background:#1b2634;border:1px solid var(--line);border-radius:10px;padding:5px;box-shadow:0 8px 25px #0008}.profile.open .panel{display:block}.panel button{display:block;width:100%;text-align:left;padding:10px;border-radius:7px}.panel button:hover{background:#263548}
.nav{display:flex;align-items:center;padding:4px 8px}.nav .label{flex:1;min-width:0;text-align:center;font-size:16px;font-weight:650}.nav button{padding:7px}.views{display:flex;gap:4px;padding:0 8px 7px}.views button{padding:6px 9px;border-radius:7px;background:#182331;color:#9eabbb;font-size:12px}.views button.active{background:#245d96;color:#fff}
.grid{padding:0 3px}.week-head,.week-row{display:grid;grid-template-columns:minmax(72px,1.08fr) repeat(5,minmax(0,1fr));width:100%}.week-head>div,.week-row>div{border:.5px solid var(--line)}.week-head{height:48px}.dayhead{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}.dayhead span{display:block;color:#8997aa;margin-left:3px}.add{font-size:25px;text-align:left;padding-left:8px}.project{min-width:0;padding:7px 4px;display:flex;align-items:center;cursor:pointer}.project b{display:block;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}.cell{min-width:0;padding:2px;cursor:pointer;vertical-align:top}.trade{display:block;width:100%;margin:2px 0;padding:4px 3px;border:1px solid currentColor;border-radius:5px;background:color-mix(in srgb,currentColor 14%,transparent);font-size:9px;font-weight:700;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:clip}
.calendar{padding:0 3px}.cal-head,.cal-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}.cal-head>div,.cal-row>div{border:.5px solid var(--line)}.cal-head{height:35px}.cal-head div{text-align:center;padding-top:9px;font-size:10px;font-weight:700}.cal-row{min-height:95px}.cal-day{min-width:0;padding:3px}.adj{background:#080d14}.date{text-align:center;font-size:12px;font-weight:700;color:#e8eef7}.adj .date{color:#566274}.tradecal{display:block;margin-top:3px;padding:4px 2px;border:1px solid currentColor;border-radius:5px;background:color-mix(in srgb,currentColor 14%,transparent);font-size:9px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:clip;text-align:center}
.modal-bg{display:none;position:fixed;inset:0;background:#000a;z-index:50;align-items:center;justify-content:center;padding:18px}.modal-bg.show{display:flex}.modal{width:min(440px,100%);max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:17px}.modal h2{margin:0 0 13px;font-size:19px}.modal input{width:100%;padding:10px;border:1px solid #3b4a5f;background:#0b1018;color:#fff;border-radius:8px;margin-bottom:10px}.checks{max-height:48vh;overflow:auto;border:1px solid #293749;border-radius:8px}.check{display:flex;align-items:center;gap:9px;padding:10px;border-bottom:1px solid #263244}.check:last-child{border:0}.check input{width:18px;height:18px}.swatch{width:12px;height:12px;border-radius:3px;display:inline-block}.actions{display:flex;justify-content:flex-end;gap:7px;margin-top:13px}.actions button{padding:9px 13px;border-radius:8px}.primary{background:#245d96}.danger{color:#ff7777}.notice{padding:10px;border-radius:8px;background:#172333;color:#aeb9c8;font-size:12px}
.login{position:fixed;inset:0;background:#0b1018;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}.loginbox{width:min(390px,100%);background:#121923;border:1px solid var(--line);border-radius:15px;padding:22px}.loginbox h1{margin-top:0}.loginbox input{width:100%;padding:11px;margin:5px 0 10px;border:1px solid #3b4a5f;background:#0b1018;color:#fff;border-radius:8px}.loginbox button{width:100%;padding:11px;background:#245d96;border-radius:8px;font-weight:700}
.notif{max-height:55vh;overflow:auto}.n{padding:10px;border-bottom:1px solid #2b3747;font-size:12px}.n.unread{background:#19283a}.muted{color:var(--muted);font-size:11px}
@media(max-width:600px){.week-head,.week-row{grid-template-columns:minmax(62px,1.08fr) repeat(5,minmax(0,1fr))}.project{padding:5px 2px}.project b{font-size:10px}.trade{font-size:8px;padding:3px 2px}.calendar{padding:0 1px}}
</style></head>
<body><div id="login" class="login"><div class="loginbox"><h1>Welcome to SubCal</h1><p>Enter your first and last name. This device will remember you.</p><input id="first" placeholder="First name"><input id="last" placeholder="Last name"><button id="start">Continue</button></div></div>
<main class="app"><header class="top"><div><div class="title">SubCal</div><div id="sync" class="sync">● Local</div></div><div id="profile" class="profile"><button id="profileBtn">Profile</button><div class="panel">
<button data-action="all">View All Projects</button><button data-action="mine">My Jobs</button><button data-action="subs">Edit Subs</button><button data-action="notifications">Notifications <span id="badge"></span></button><button data-action="logout">Log Out</button></div></div></header>
<div class="views"><button id="weekBtn" class="active">Week View</button><button id="calBtn">Calendar View</button></div><div class="nav"><button id="prev">‹</button><div id="navLabel" class="label"></div><button id="next">›</button><button id="today">Today</button></div><section id="content"></section></main>
<div class="modal-bg" id="modal"><div class="modal"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="actions"><button id="cancel">Cancel</button><button id="save" class="primary">Done</button></div></div></div>
<script>
const URL="__SUPABASE_URL__",KEY="__SUPABASE_KEY__",ID="crew-schedule-shared",USERKEY="subcal-user";
const colors=["#4da6ff","#ffd84d","#aeb7c4","#ffffff","#b77cff","#ff8c42","#54d88a","#ff6b9d"];
let state=JSON.parse(localStorage.getItem("subcal-state")||'{"users":[],"trades":[],"projects":[],"assignments":{},"notifications":[]}'),me=JSON.parse(localStorage.getItem(USERKEY)||"null"),mode="week",filter="all",monday=getMonday(new Date()),month=new Date(new Date().getFullYear(),new Date().getMonth(),1),editing=null;
const $=x=>document.getElementById(x), uid=()=>crypto.randomUUID(), dateKey=d=>new Date(d).toISOString().slice(0,10);
function getMonday(d){d=new Date(d);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function initials(n){return n.trim().split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase()}
function ensureDefaults(){if(!state.trades.length)state.trades=[{id:"plumbing",name:"Plumbing",color:"#4da6ff"},{id:"electrical",name:"Electrical",color:"#ffd84d"},{id:"hvac",name:"HVAC / Mechanical",color:"#aeb7c4"},{id:"tile",name:"Tile",color:"#ffffff"}]}
function save(){localStorage.setItem("subcal-state",JSON.stringify(state))}
function syncText(t){$("sync").textContent=t}
async function api(method,body){let u=URL.replace(/\/$/,"")+"/rest/v1/crew_schedule";if(method==="GET")u+="?id=eq."+encodeURIComponent(ID)+"&select=payload";else u+="?on_conflict=id";let r=await fetch(u,{method,headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"},body:method==="GET"?undefined:JSON.stringify(body)});if(!r.ok)throw Error("HTTP "+r.status);return method==="GET"?r.json():null}
async function pull(){if(!KEY){syncText("● Local only");return}try{syncText("↻ Syncing…");let a=await api("GET");if(a[0]?.payload){state=a[0].payload;ensureDefaults();save();}syncText("● Synced · "+new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}));render()}catch(e){syncText("● Sync error")}}
async function push(){save();if(!KEY)return;try{syncText("↻ Syncing…");await api("POST",{id:ID,payload:state,updated_at:new Date().toISOString()});syncText("● Synced · "+new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}))}catch(e){syncText("● Sync error")}}
function openCell(p,d){editing={type:"cell",project:p,date:dateKey(d),selected:new Set(state.trades.filter(t=>state.assignments[p.id+"|"+dateKey(d)+"|"+t.id]).map(t=>t.id))};$("modalTitle").textContent=p.name+" · "+d.toLocaleDateString([], {weekday:"long",month:"short",day:"numeric"});$("modalBody").innerHTML='<div class="notice">Select every trade scheduled for this job that day.</div><div class="checks">'+state.trades.map(t=>{let a=state.assignments[p.id+"|"+dateKey(d)+"|"+t.id];return '<label class="check"><input type="checkbox" data-trade="'+esc(t.id)+'" '+(a?"checked":"")+'><span class="swatch" style="background:'+t.color+'"></span><b>'+esc(t.name)+'</b>'+(a?' <span class="muted">— '+esc(initials(a.userName||""))+'</span>':'')+'</label>'}).join("")+'</div>';$("modal").classList.add("show")}
function openProject(p){editing={type:"project",project:p};$("modalTitle").textContent=p?"Edit Project":"Add Project";$("modalBody").innerHTML='<input id="projectName" placeholder="Project name" value="'+esc(p?.name||"")+'"><div class="actions"><button id="projectDelete" class="danger" '+(p?"":"style="display:none"")+'>Delete</button></div>';$("modal").classList.add("show");$("projectName").focus()}
function openSubs(){editing={type:"subs"};$("modalTitle").textContent="Edit Subs / Trades";$("modalBody").innerHTML='<div id="tradeList">'+state.trades.map((t,i)=>'<div class="check"><span class="swatch" style="background:'+t.color+'"></span><input data-tname="'+esc(t.id)+'" value="'+esc(t.name)+'" style="flex:1;background:#0b1018;color:#fff;border:1px solid #3b4a5f;border-radius:6px;padding:7px"><input type="color" data-tcolor="'+esc(t.id)+'" value="'+t.color+'"><button class="danger" data-deltrade="'+esc(t.id)+'">−</button></div>').join("")+'</div><button id="addTrade" style="margin-top:10px">＋ Add trade</button>';$("modal").classList.add("show")}
function openNotifs(){$("modalTitle").textContent="Notifications";$("modalBody").innerHTML='<div class="notif">'+state.notifications.filter(n=>n.recipientId===me.id).sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).map(n=>'<div class="n '+(!n.read?"unread":"")+'">'+esc(n.message)+'<div class="muted">'+new Date(n.createdAt).toLocaleString()+'</div></div>').join("")+'</div>';state.notifications.forEach(n=>{if(n.recipientId===me.id)n.read=true});save();$("modal").classList.add("show");updateBadge()}
function applyCell(){document.querySelectorAll("[data-trade]").forEach(cb=>{let tid=cb.dataset.trade,key=editing.project.id+"|"+editing.date+"|"+tid,old=state.assignments[key];if(cb.checked&&!old){let t=state.trades.find(x=>x.id===tid);state.assignments[key]={userId:me.id,userName:me.name,assignedAt:new Date().toISOString()}}else if(!cb.checked&&old){if(old.userId!==me.id&&!confirm("Remove "+(state.trades.find(x=>x.id===tid)?.name||"trade")+" scheduled by "+old.userName+"? They will be notified.")) {cb.checked=true;return} if(old.userId!==me.id)state.notifications.push({id:uid(),recipientId:old.userId,message:(state.trades.find(x=>x.id===tid)?.name||"Trade")+" was removed from "+editing.project.name+" on "+new Date(editing.date+"T12:00:00").toLocaleDateString(undefined,{weekday:"long"})+" by "+me.name+".",read:false,createdAt:new Date().toISOString()});delete state.assignments[key]}});save();push()}
function renderWeek(){let ds=[0,1,2,3,4].map(i=>{let d=new Date(monday);d.setDate(d.getDate()+i);return d}),ps=state.projects.filter(p=>filter==="all"||p.ownerId===me.id),h='<div class="grid"><div class="week-head"><div><button class="add" id="addProject">+</button></div>'+ds.map(d=>'<div class="dayhead">'+d.toLocaleDateString([], {weekday:"short"}).toUpperCase()+' <span>'+d.getDate()+'</span></div>').join("")+'</div>';let rows=ps.map(p=>'<div class="week-row"><div class="project" data-project="'+p.id+'"><b>'+esc(p.name)+'</b></div>'+ds.map(d=>{let as=state.trades.filter(t=>state.assignments[p.id+"|"+dateKey(d)+"|"+t.id]);return '<div class="cell" data-cell="'+p.id+'|'+dateKey(d)+'">'+as.map(t=>{let a=state.assignments[p.id+"|"+dateKey(d)+"|"+t.id];return '<span class="trade" style="color:'+t.color+'" title="'+esc(t.name)+'">'+esc(t.name)+' — '+esc(initials(a.userName||""))+'</span>'}).join("")+'</div>'}).join("")+'</div>').join("");return h+rows+"</div>"}
function renderCal(){let fm=getMonday(new Date(month.getFullYear(),month.getMonth(),1)),lm=getMonday(new Date(month.getFullYear(),month.getMonth()+1,0)),h='<div class="calendar"><div class="cal-head">'+["MON","TUE","WED","THU","FRI"].map(x=>"<div>"+x+"</div>").join("")+"</div>";for(let w=new Date(fm);w<=lm;w.setDate(w.getDate()+7)){h+='<div class="cal-row">';for(let i=0;i<5;i++){let d=new Date(w);d.setDate(d.getDate()+i), trades=state.trades.filter(t=>state.projects.some(p=>state.assignments[p.id+"|"+dateKey(d)+"|"+t.id]));h+='<div class="cal-day '+(d.getMonth()!==month.getMonth()?"adj":"")+'"><div class="date">'+d.getDate()+"</div>"+trades.map(t=>'<span class="tradecal" style="color:'+t.color+'">'+esc(t.name)+'</span>').join("")+"</div>"}h+="</div>"}return h+"</div>"}
function render(){ensureDefaults();$("weekBtn").classList.toggle("active",mode==="week");$("calBtn").classList.toggle("active",mode==="calendar");$("navLabel").textContent=mode==="week"?monday.toLocaleDateString([], {month:"short",day:"numeric"})+" – "+new Date(monday.getTime()+4*86400000).toLocaleDateString([], {month:"short",day:"numeric",year:"numeric"}):month.toLocaleDateString([], {month:"long",year:"numeric"});$("content").innerHTML=mode==="week"?renderWeek():renderCal();document.querySelectorAll("[data-cell]").forEach(e=>e.onclick=()=>{let [pid,ds]=e.dataset.cell,p=state.projects.find(x=>x.id===pid);openCell(p,new Date(ds+"T12:00:00"))});document.querySelectorAll("[data-project]").forEach(e=>e.onclick=()=>openProject(state.projects.find(p=>p.id===e.dataset.project)));$("addProject").onclick=()=>openProject(null);updateBadge()}
function updateBadge(){let n=state.notifications.filter(x=>x.recipientId===me?.id&&!x.read).length;$("badge").textContent=n?" ("+n+")":""}
$("start").onclick=()=>{let name=($("first").value.trim()+" "+$("last").value.trim()).trim();if(name.split(/\s+/).length<2)return alert("Please enter your first and last name.");me={id:uid(),name};state.users=state.users.filter(u=>u.name!==name);state.users.push(me);localStorage.setItem(USERKEY,JSON.stringify(me));save();$("login").style.display="none";render();push()};$("profileBtn").onclick=()=>$("profile").classList.toggle("open");
document.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>{let a=b.dataset.action;$("profile").classList.remove("open");if(a==="all"){filter="all";render()}else if(a==="mine"){filter="mine";render()}else if(a==="subs")openSubs();else if(a==="notifications")openNotifs();else if(a==="logout"){localStorage.removeItem(USERKEY);location.reload()}});
$("weekBtn").onclick=()=>{mode="week";render()};$("calBtn").onclick=()=>{mode="calendar";render()};$("prev").onclick=()=>{if(mode==="week")monday.setDate(monday.getDate()-7);else month.setMonth(month.getMonth()-1);render()};$("next").onclick=()=>{if(mode==="week")monday.setDate(monday.getDate()+7);else month.setMonth(month.getMonth()+1);render()};$("today").onclick=()=>{if(mode==="week")monday=getMonday(new Date());else month=new Date(new Date().getFullYear(),new Date().getMonth(),1);render()};
$("cancel").onclick=()=>{$("modal").classList.remove("show");editing=null};$("save").onclick=()=>{if(!editing)return;if(editing.type==="cell"){applyCell()}else if(editing.type==="project"){let name=$("projectName").value.trim();if(!name)return;if(editing.project){state.projects=state.projects.map(p=>p.id===editing.project.id?{...p,name}:p)}else state.projects.push({id:uid(),name,ownerId:me.id});state.projects.sort((a,b)=>a.name.localeCompare(b.name));push()}else if(editing.type==="subs"){document.querySelectorAll("[data-tname]").forEach(i=>{let t=state.trades.find(x=>x.id===i.dataset.tname);if(t)t.name=i.value.trim()||t.name});document.querySelectorAll("[data-tcolor]").forEach(i=>{let t=state.trades.find(x=>x.id===i.dataset.tcolor);if(t)t.color=i.value});push()}$("modal").classList.remove("show");editing=null;render()};
$("modal").addEventListener("click",e=>{if(e.target.id==="addTrade"){state.trades.push({id:uid(),name:"New Trade",color:colors[state.trades.length%colors.length]});openSubs()}if(e.target.dataset.deltrade){let t=state.trades.find(x=>x.id===e.target.dataset.deltrade);if(confirm("Delete "+t.name+"?")){state.trades=state.trades.filter(x=>x.id!==t.id);Object.keys(state.assignments).filter(k=>k.endsWith("|"+t.id)).forEach(k=>delete state.assignments[k]);openSubs()}}if(e.target.id==="projectDelete"&&editing?.project&&confirm("Delete this project and its schedule?")){state.projects=state.projects.filter(p=>p.id!==editing.project.id);Object.keys(state.assignments).filter(k=>k.startsWith(editing.project.id+"|")).forEach(k=>delete state.assignments[k]);$("modal").classList.remove("show");editing=null;push();render()}});
document.addEventListener("click",e=>{if(!e.target.closest(".profile"))$("profile").classList.remove("open")});
if(!me){$("login").style.display="flex"}else{$("login").style.display="none";state.users=state.users.some(u=>u.id===me.id)?state.users:[...state.users,me];ensureDefaults();render();pull();setInterval(pull,15000)}
</script></body></html>
