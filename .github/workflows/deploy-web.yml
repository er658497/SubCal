name: Deploy Crew Schedule Web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare web app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SCHEDULE_ID: ${{ secrets.SCHEDULE_ID }}
        run: |
          mkdir -p _site
          cp file_000000001c2c81fda4d190be79690438.png _site/subcal-logo.png
          python3 - <<'PY'
          from pathlib import Path
          import base64, os
          s = Path("web/index.html").read_text()
          def b64(value):
              return base64.b64encode(value.encode()).decode()
          s = s.replace("__SUPABASE_URL_B64__", b64(os.environ.get("SUPABASE_URL", "")))
          s = s.replace("__SUPABASE_KEY_B64__", b64(os.environ.get("SUPABASE_ANON_KEY", "")))
          s = s.replace("__SCHEDULE_ID_B64__", b64(os.environ.get("SCHEDULE_ID", "default") or "default"))
          Path("_site/index.html").write_text(s)
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
