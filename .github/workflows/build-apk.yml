name: Build SubCal APK
# SubCal APK build trigger

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Prepare SubCal launcher icon
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          cp file_000000001c2c81fda4d190be79690438.png app/src/main/res/drawable-nodpi/subcal_icon.png

      - name: Build debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SCHEDULE_ID: ${{ secrets.SCHEDULE_ID }}
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: subcal-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
